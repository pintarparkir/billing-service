syntax = "proto3";

package parkirpintar.billing.v1;

option go_package = "github.com/farid/billing-service/api/proto/billing/v1;billingv1";

import "google/protobuf/timestamp.proto";

service BillingService {
  rpc OpenInvoice  (OpenInvoiceRequest)  returns (Invoice);
  rpc CloseInvoice (CloseInvoiceRequest) returns (Invoice);
  rpc GetInvoice   (GetInvoiceRequest)   returns (Invoice);
  rpc CreatePaymentRequest (CreatePaymentReq) returns (PaymentRequest);
}

enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  OPEN = 1;
  CLOSED = 2;
  PAID = 3;
  VOID = 4;
}

enum LineKind {
  LINE_KIND_UNSPECIFIED = 0;
  BOOKING = 1;
  HOURLY = 2;
  OVERNIGHT = 3;
  CANCELLATION = 4;
  NOSHOW = 5;
}

message LineItem {
  string id = 1;
  LineKind kind = 2;
  int64 amount_idr = 3;
}

message Invoice {
  string id = 1;
  string reservation_id = 2;
  InvoiceStatus status = 3;
  int64 total_idr = 4;
  repeated LineItem lines = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp closed_at = 7;
  google.protobuf.Timestamp paid_at = 8;
}

message OpenInvoiceRequest  { string reservation_id = 1; string driver_id = 2; }
message CloseInvoiceRequest {
  string invoice_id = 1;
  google.protobuf.Timestamp checked_in_at = 2;
  google.protobuf.Timestamp checked_out_at = 3;
}
message GetInvoiceRequest   { string id = 1; }

// CreatePaymentReq represents a new booking fee payment request to be created.
message CreatePaymentReq {
  string reservation_id = 1;  // ID of the reservation to charge
  string driver_id = 2;       // Driver's unique identifier
  int64 amount_idr = 3;       // Booking fee amount in IDR
  string method = 4;          // Payment method: "QRIS" or "CC"
  string cc_token = 5;        // Credit card token (required if method=CC)
}

// PaymentRequest represents the result of payment request creation.
message PaymentRequest {
  string id = 1;              // Unique ID for this payment request
  string method = 2;          // Payment method used
  string status = 3;          // Status: "PENDING", "SUCCESS", "FAILED"
  string qris_url = 4;        // QRIS URL (only if method=QRIS)
  string payment_ref = 5;     // Provider-facing reference ID
  int64 expires_at = 6;       // Unix timestamp when payment expires
}
